name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Zależności
        run: npm install --no-audit --no-fund

      - name: Projekt Android
        run: |
          node scripts/build-www.js
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - name: Stały klucz podpisu (aktualizacje bez odinstalowania)
        run: |
          mkdir -p ~/.android
          cp android-res/debug.keystore ~/.android/debug.keystore

      - name: Budowanie APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../KarieraMenedzera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KarieraMenedzera-apk
          path: KarieraMenedzera.apk

      - name: Wydanie z plikiem APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Kariera Menedżera 2.0.${{ github.run_number }}
          body: |
            Aplikacja na Androida (np. Samsung Galaxy S25). Pobierz KarieraMenedzera.apk na telefonie i zainstaluj
            (zezwól przeglądarce na instalowanie aplikacji z nieznanych źródeł). Nowe wersje instalują się na starą – zapis gry zostaje.
          files: KarieraMenedzera.apk
          make_latest: true
